<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz List</title>
    <link rel="stylesheet" th:href="@{/css/quizlist.css}">
</head>
<body>
<div class="container">
    <h1>Quiz Management</h1>

    <a href="/addquiz" class="add-question-btn">+ Add New Question</a>

    <table th:if="${!questions.isEmpty()}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Question</th>
            <th>Options</th>
            <th>Correct Answer</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="question: ${questions}">
            <td th:text="${question.id}"></td>
            <td th:text="${question.questionText}"></td>
            <td>
                <ul class="options-list">
                    <li th:each="option, iterStat : ${question.options}"
                        th:text="${iterStat.index + 1} + '. ' + ${option}">
                    </li>
                </ul>
            </td>
            <td th:text="${question.correctAnswer}"></td>
            <td>
                <div class="actions">
                    <a th:href="@{/editquiz/{id}(id=${question.id})}" class="btn btn-edit">
                        Edit
                    </a>
                    <form th:action="@{/question/delete/{id}(id=${question.id})}"
                          method="post" class="delete-form">
                        <input type="hidden" name="_method" value="DELETE">
                        <button type="submit" class="btn btn-delete"
                                onclick="return confirm('Are you sure you want to delete this question?')">
                            Delete
                        </button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="no-questions" th:if="${questions.isEmpty()}">
        No questions available. Add one to get started!
    </p>
</div>
</body>
</html>
